</style></head><body><section class="slide"><header class="mast"><div><div class="label">02 · 企业 AI 的真实难题</div><h1>企业 AI 的<span>四个真实难题</span></h1></div><p class="prompt">四个表象，指向同一个本质。</p></header><div class="evidence"><article class="problem"><div class="num">01</div><h2>场景难选</h2><p>不知道什么值得投入，缺少明确的价值判断。</p></article><article class="problem"><div class="num">02</div><h2>落地难</h2><p>真实数据、系统、权限与业务流程带来复杂约束。</p></article><article class="problem"><div class="num">03</div><h2>规模化难</h2><p>一个 PoC 跑通，不代表可以稳定复制到整个组织。</p></article><article class="problem"><div class="num">04</div><h2>组织变革难</h2><p>人、流程、岗位和管理机制没有同步发生改变。</p></article></div><div class="flow"><div class="from">从四个难题<br>看到真正的缺口</div><div class="arrow">→</div><div class="conclusion"><div class="small">企业不缺 AI，</div><div class="big">缺的是把 AI 变成<span>业务结果</span>。</div></div></div><div class="folio">02 / 11</div></section></body></html>
