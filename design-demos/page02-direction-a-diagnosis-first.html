</style></head><body><section class="slide"><div class="topline"><span>ENTERPRISE AI · REAL CHALLENGES</span><span>问题定义</span></div><div class="hero"><h1>企业 AI 的<br><span>四个真实难题</span></h1><p>不是模型够不够强，<br>而是价值能不能真正发生。</p></div><div class="thesis"><div class="lead">企业不缺 AI，</div><div class="result">缺的是把 AI 变成业务结果。</div></div><div class="problems"><article class="problem"><div class="num">01</div><h2>场景难选</h2><p>不知道什么值得投入，业务目标与 ROI 判断不清晰。</p></article><article class="problem"><div class="num">02</div><h2>落地难</h2><p>Demo 容易，接入真实数据、系统、权限和流程很难。</p></article><article class="problem"><div class="num">03</div><h2>规模化难</h2><p>PoC 跑通，不代表能稳定运行并跨组织复制。</p></article><article class="problem"><div class="num">04</div><h2>组织变革难</h2><p>人、流程、岗位与管理机制没有同步改变。</p></article></div><div class="folio">02 / 11</div></section></body></html>
